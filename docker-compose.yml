version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: sp-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: admin123
      MYSQL_DATABASE: shiksha_pilot
    ports:
      - "2001:3306"
    volumes:
      - db_data:/var/lib/mysql

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sp-backend
    restart: always
    ports:
      - "2002:8000"
    volumes:
      - ./backend:/var/www/html
      - /var/www/html/vendor
    environment:
      - DB_HOST=db
      - DB_USER=root
      - DB_PASS=admin123
      - DB_NAME=shiksha_pilot
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sp-frontend
    restart: always
    ports:
      - "2003:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://backend:8000
    depends_on:
      - backend

  website:
    build:
      context: ./website
      dockerfile: Dockerfile
    container_name: sp-website
    restart: always
    ports:
      - "2005:80"
    volumes:
      - ./website:/var/www/html

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: sp-phpmyadmin
    restart: always
    ports:
      - "2004:80"
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: admin123
    depends_on:
      - db

volumes:
  db_data:
