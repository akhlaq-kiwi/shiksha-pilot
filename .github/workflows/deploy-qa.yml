name: Deploy to QA (Hostinger)

# Manual-only: no push/PR trigger. Trigger from the Actions tab ("Run
# workflow") or `gh workflow run deploy-qa.yml`.
on:
  workflow_dispatch:

concurrency:
  group: deploy-qa
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: qa
    steps:
      - name: Verify triggered from qa branch
        run: |
          if [ "${{ github.ref }}" != "refs/heads/qa" ]; then
            echo "::error::This workflow must be run from the 'qa' branch (use the 'Use workflow from' branch picker). Current ref: ${{ github.ref }}"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Write frontend QA env
        run: |
          cat > frontend/.env.qa <<EOF
          VITE_API_URL=${{ secrets.QA_VITE_API_URL }}
          VITE_APP_NAME=${{ secrets.QA_VITE_APP_NAME }}
          VITE_APP_VERSION=${{ secrets.QA_VITE_APP_VERSION }}
          EOF

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build -- --mode qa

      - name: Create deployment package
        run: |
          set -e
          BUILD_DIR=".builds"
          TEMP_DIR="$BUILD_DIR/deploy_temp"
          TAR_FILE="$BUILD_DIR/deploy.tar.gz"
          mkdir -p "$BUILD_DIR"
          rm -rf "$TEMP_DIR" "$TAR_FILE"
          mkdir -p "$TEMP_DIR"

          # Frontend build
          cp -r frontend/dist/* "$TEMP_DIR/"

          # Backend files into api/
          mkdir -p "$TEMP_DIR/api"
          cp -r backend/src "$TEMP_DIR/api/"
          cp -r backend/public "$TEMP_DIR/api/"
          if [ -d "backend/config" ]; then
            cp -r backend/config "$TEMP_DIR/api/"
          fi
          cp backend/composer.json "$TEMP_DIR/api/"
          cp backend/composer.lock "$TEMP_DIR/api/"

          # Backend .env assembled entirely from secrets
          cat > "$TEMP_DIR/api/.env" <<EOF
          APP_ENV=qa
          APP_DEBUG=${{ secrets.QA_APP_DEBUG }}
          APP_NAME=${{ secrets.QA_APP_NAME }}
          DB_HOST=${{ secrets.QA_DB_HOST }}
          DB_PORT=${{ secrets.QA_DB_PORT }}
          DB_NAME=${{ secrets.QA_DB_NAME }}
          DB_USER=${{ secrets.QA_DB_USER }}
          DB_PASS=${{ secrets.QA_DB_PASS }}

          JWT_SECRET=${{ secrets.QA_JWT_SECRET }}

          SMTP_HOST=${{ secrets.QA_SMTP_HOST }}
          SMTP_PORT=${{ secrets.QA_SMTP_PORT }}
          SMTP_USER=${{ secrets.QA_SMTP_USER }}
          SMTP_PASS=${{ secrets.QA_SMTP_PASS }}
          SMTP_FROM_NAME=${{ secrets.QA_SMTP_FROM_NAME }}
          EOF

          # Create config directory if not present
          mkdir -p "$TEMP_DIR/api/config"

          # 1. Decode base64 secret into config/firebase-service-account.json if present
          if [ -n "${{ secrets.QA_FIREBASE_SERVICE_ACCOUNT_B64 }}" ]; then
            echo "${{ secrets.QA_FIREBASE_SERVICE_ACCOUNT_B64 }}" | base64 --decode > "$TEMP_DIR/api/config/firebase-service-account.json"
          elif [ -n "${{ secrets.QA_FIREBASE_SERVICE_ACCOUNT_JSON }}" ]; then
            echo '${{ secrets.QA_FIREBASE_SERVICE_ACCOUNT_JSON }}' > "$TEMP_DIR/api/config/firebase-service-account.json"
          fi

          # Root .htaccess for frontend client-side routing
          cat > "$TEMP_DIR/.htaccess" <<'EOF'
          <IfModule mod_headers.c>
              <FilesMatch "\.(html)$">
                  Header set Cache-Control "no-cache, no-store, must-revalidate"
                  Header set Pragma "no-cache"
                  Header set Expires 0
              </FilesMatch>
          </IfModule>

          <IfModule mod_rewrite.c>
              RewriteEngine On
              RewriteBase /

              RewriteCond %{REQUEST_FILENAME} -f [OR]
              RewriteCond %{REQUEST_FILENAME} -d
              RewriteRule ^ - [L]

              RewriteRule ^ index.html [L]
          </IfModule>
          EOF

          # api/.htaccess routes API sub-requests to public/index.php
          cat > "$TEMP_DIR/api/.htaccess" <<'EOF'
          <IfModule mod_rewrite.c>
              RewriteEngine On
              RewriteCond %{REQUEST_FILENAME} !-f
              RewriteRule ^(.*)$ public/index.php [QSA,L]
          </IfModule>
          EOF

          COPYFILE_DISABLE=1 tar -czf "$TAR_FILE" -C "$TEMP_DIR" .
          rm -rf "$TEMP_DIR"

      - name: Upload package via SSH
        env:
          SSHPASS: ${{ secrets.QA_SSH_PASSWORD }}
        run: |
          set -e
          sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
          sshpass -e scp -o StrictHostKeyChecking=no -P "${{ secrets.QA_SSH_PORT }}" \
            .builds/deploy.tar.gz \
            "${{ secrets.QA_SSH_USER }}@${{ secrets.QA_SSH_HOST }}:${{ secrets.QA_REMOTE_PATH }}/"

      - name: Extract package and run migrations on remote
        env:
          SSHPASS: ${{ secrets.QA_SSH_PASSWORD }}
        run: |
          set -e
          REMOTE_PATH="${{ secrets.QA_REMOTE_PATH }}"
          EXTRACT_CMD="cd $REMOTE_PATH && rm -rf assets api index.html && tar --warning=no-unknown-keyword -xzf deploy.tar.gz && rm deploy.tar.gz && echo 'Running composer install...' && composer install --no-dev --optimize-autoloader --working-dir=$REMOTE_PATH/api && echo 'Running migrations...' && php api/src/Database/migrate.php"
          sshpass -e ssh -o StrictHostKeyChecking=no -p "${{ secrets.QA_SSH_PORT }}" \
            "${{ secrets.QA_SSH_USER }}@${{ secrets.QA_SSH_HOST }}" "$EXTRACT_CMD"

      - name: Done
        run: echo "QA deployment completed successfully."
